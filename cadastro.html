<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Cadastro — OBE 2026 SGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-login">
  <div id="app">
    <section id="screen-cadastro" class="screen screen--active" aria-label="Cadastro">
      <img class="bg-watermark" src="img/brasao-2rg.png" alt="" aria-hidden="true" />
      <div class="brand-stripes" aria-hidden="true">
        <div class="brand-stripes__red"></div>
        <div class="brand-stripes__blue"></div>
      </div>
      <header class="logo-topo" aria-label="OBE">
        <img class="logo-topo__center" src="img/logo-obe.png" alt="OBE — Operação Batalhão Escola I-26" />
      </header>
      <div class="login-content">
        <p class="brand-system">Cadastro de usuário</p>

        <form id="cadastro-form" class="login-form" autocomplete="off">
          <label class="field">
            <span class="visually-hidden">RE</span>
            <input type="text" id="cad-login" name="login" placeholder="RE (sem dígito)" required inputmode="numeric" autocomplete="username" />
          </label>
          <label class="field">
            <span class="visually-hidden">Senha</span>
            <input type="password" id="cad-senha" name="senha" placeholder="Senha" required autocomplete="new-password" minlength="4" />
          </label>
          <label class="field">
            <span class="visually-hidden">Confirmar senha</span>
            <input type="password" id="cad-senha2" name="senha2" placeholder="Confirmar senha" required autocomplete="new-password" minlength="4" />
          </label>
          <p id="cadastro-error" class="login-error" hidden></p>
          <p id="cadastro-ok" class="login-success" hidden>Usuário criado com sucesso.</p>
          <button type="submit" class="btn btn--primary" id="cad-submit">Cadastrar</button>
        </form>

        <p class="auth-link">
          Já tem conta?
          <a href="index.html">Entrar</a>
        </p>
      </div>

      <footer class="app-footer">
        <div class="app-footer__logos">
          <img src="img/logo-pmesp.png" alt="Polícia Militar de São Paulo" />
          <img src="img/brasao-2rg.png" alt="Brasão ESSgt" />
        </div>
        <p class="year-footer">2026</p>
      </footer>
      <div class="brand-stripes" aria-hidden="true">
        <div class="brand-stripes__red"></div>
        <div class="brand-stripes__blue"></div>
      </div>
    </section>
  </div>

  <script src="js/config.js?v=7"></script>
  <script src="js/supabase-api.js?v=7"></script>
  <script src="js/cadastro.js?v=7"></script>
</body>
</html>
