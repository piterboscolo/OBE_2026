<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Home — OBE 2026 SGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-home">
  <div id="app">
    <section id="screen-app" class="screen screen--active" aria-label="Home">
      <img class="bg-watermark" src="img/brasao-2rg.png" alt="" aria-hidden="true" />
      <div class="brand-stripes" aria-hidden="true">
        <div class="brand-stripes__red"></div>
        <div class="brand-stripes__blue"></div>
      </div>

      <main id="main" class="main" tabindex="-1">
        <div class="page page--cards-only">
          <button type="button" class="btn-sair" id="btn-sair" title="Sair">Sair</button>
          <div class="access-grid" id="access-grid">
            <!-- cards montados pelo JS -->
          </div>
        </div>
      </main>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
